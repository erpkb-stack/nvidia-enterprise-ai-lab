# Production stack for a shared Docker host behind an existing Caddy reverse proxy.
#
#   docker compose -p ailab -f deploy/docker-compose.server.yml --env-file .env up -d --build
#
# - No host ports are published. TLS and routing are done by the host's Caddy container.
# - Service names are prefixed (ailab-*) so they never collide with other apps' DNS names
#   (e.g. "frontend"/"backend") on the shared proxy network.
# - Only the web-facing services join the proxy network; databases stay on the private network.

name: ailab

services:
  ailab-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nvidia_lab}
      POSTGRES_USER: ${POSTGRES_USER:-nvidia_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nvidia_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  ailab-qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes: [qdrant_data:/qdrant/storage]
    networks: [internal]
    mem_limit: 1g
    restart: unless-stopped

  ailab-backend:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nvidia_lab}:${POSTGRES_PASSWORD}@ailab-postgres:5432/${POSTGRES_DB:-nvidia_lab}
      QDRANT_URL: http://ailab-qdrant:6333
      REDIS_URL: ""
      BACKEND_CORS_ORIGINS: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      AUTO_CREATE_TABLES: "false"
      APP_ENV: production
      WEB_CONCURRENCY: "2"
    networks: [internal, proxy]
    depends_on:
      ailab-postgres: {condition: service_healthy}
      ailab-qdrant: {condition: service_started}
    mem_limit: 1g
    restart: unless-stopped

  ailab-frontend:
    build:
      context: ../frontend
      args:
        # Same origin: the proxy sends /api/* to the backend.
        NEXT_PUBLIC_API_URL: https://${PUBLIC_HOST}
    networks: [proxy]
    depends_on:
      ailab-backend: {condition: service_healthy}
    mem_limit: 512m
    restart: unless-stopped

networks:
  internal: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-aiecc_default}

volumes:
  postgres_data:
  qdrant_data:
